[project]
name = "invoice-organizer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "streamlit>=1.40",
    "gspread>=6.0",
    "pandas>=2",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
