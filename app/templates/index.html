<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invoice Organizer</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>Invoice Organizer</h1>
    <section class="upload">
      <input type="file" id="files" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/png,image/jpeg" multiple>
      <button id="upload-btn">Upload &amp; extract</button>
      <button id="add-btn" class="secondary">+ Add invoice manually</button>
      <a id="download" class="button" href="/api/export.csv">Download CSV</a>
      <span id="status" role="status"></span>
    </section>
    <ul id="errors"></ul>
    <p class="hint">Click any cell to correct it &mdash; changes save automatically. Highlighted cells are missing or look wrong.
      <label><input type="checkbox" id="review-only"> Show only rows needing review</label>
      <span id="review-count"></span></p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>File</th><th>Purchaser</th><th>Seller</th><th>Items / services</th>
            <th>Amount</th><th>GST</th><th>Date</th><th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p id="empty" hidden>No invoices yet. Upload some above.</p>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
